name = "addictionx"
main = ".open-next/worker.js"
compatibility_date = "2026-08-17"
compatibility_flags = ["nodejs_compat"]
account_id = "cf8249741f97d302521732d8b5b5faad"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

[vars]
NEXT_PUBLIC_SITE_URL = "https://addictionx.store"
EMAIL_FROM = "ADDICTIONX <hello@addictionx.store>"
AUTH_TRUST_HOST = "true"
# Set DATABASE_URL and AUTH_SECRET as encrypted Cloudflare Worker Secrets:
#   npx wrangler secret put DATABASE_URL
#   npx wrangler secret put AUTH_SECRET

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[triggers]
crons = ["0 0 * * *"]
